    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        theme: {
                            accent: 'var(--color-accent)',
                            'accent-hover': 'var(--color-accent-hover)',
                            secondary: 'var(--color-secondary)',
                            glow: 'var(--color-glow)',
                            card: 'var(--color-card-bg)',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        :root[data-theme="fem"] {
            --color-accent: #f43f5e;        /* Rose Crimson */
            --color-accent-hover: #e11d48;
            --color-secondary: #c084fc;     /* Fuchsia Violet */
            --color-glow: rgba(244, 63, 94, 0.25);
            --color-card-bg: rgba(22, 13, 29, 0.7);
            --color-glow-hex: 0xf43f5e;
        }
        :root[data-theme="masc"] {
            --color-accent: #0284c7;        /* Electric Sky Blue */
            --color-accent-hover: #0369a1;
            --color-secondary: #6366f1;     /* Deep Indigo */
            --color-glow: rgba(2, 132, 199, 0.25);
            --color-card-bg: rgba(10, 20, 36, 0.7);
            --color-glow-hex: 0x0284c7;
        }

        html, body {
            height: 100dvh;
            width: 100%;
            overflow: hidden;
            background-color: #020617 !important;
            color: #f3f4f6;
        }

        .ambient-bg {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 15% 15%, var(--color-glow) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, #020617 100%, transparent 100%);
        }

        .modern-glass {
            background: var(--color-card-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .theme-btn-accent {
            background: linear-gradient(135deg, var(--color-accent), var(--color-secondary));
            color: #ffffff;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

                    </div>
                </div>

            </div>
        </main>
